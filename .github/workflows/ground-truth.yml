name: Ground truth (real brew install coreutils)

# Not part of the build path. This installs the REAL Homebrew
# coreutils formula on a macos runner purely as a source of ground
# truth: which coreutils version Homebrew currently pins, and
# empirically which utilities land as bare (unprefixed) symlinks vs
# g-only in /opt/homebrew/bin (Homebrew's own no_conflict logic,
# observed rather than re-derived).
#
# Expected to run rarely (few times a year) -- version changes are
# already tracked cheaply by the poll workflow, this is just to
# refresh the classification snapshot when something seems off, or on
# demand. Not wired into the build pipeline (which builds from source
# itself, see build-tarball.sh) or into individual-coreutils' install.sh
# yet -- that consumption side is still an open design question.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "23 7 1 * *" # monthly, 1st, purely a freshness check

jobs:
  ground-truth:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install real coreutils via Homebrew
        run: brew install coreutils

      - name: Report pinned version
        run: brew list --versions coreutils

      - name: Classify bare-symlink vs g-only
        run: |
          {
            echo "# Generated by ground-truth.yml -- $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# coreutils $(brew list --versions coreutils | awk '{print $2}')"
            echo "#"
            echo "# One line per utility in utils.txt that Homebrew's coreutils"
            echo "# formula installed as g<name>. bare=yes means Homebrew ALSO"
            echo "# symlinked the unprefixed name (no_conflict: nothing else on"
            echo "# this runner's /usr/bin, /usr/sbin, /bin, /sbin provides it)."
            # Filter to utils.txt rather than globbing /opt/homebrew/bin/g* --
            # the glob also matches unrelated toolchain binaries that happen to
            # start with a literal g (g++-13, gcc-13, ...), which aren't
            # coreutils and would otherwise show up here as bogus entries.
            while IFS= read -r name; do
              name="${name%%#*}"
              name="$(echo "$name" | tr -d '[:space:]')"
              [[ -z "$name" ]] && continue
              [[ -e "/opt/homebrew/bin/g$name" ]] || continue
              if [[ -L "/opt/homebrew/bin/$name" ]] && [[ "$(readlink "/opt/homebrew/bin/$name")" == "g$name" ]]; then
                echo "$name bare=yes"
              else
                echo "$name bare=no"
              fi
            done < utils.txt
          } | tee classification.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bare-symlink-classification
          path: classification.txt
          retention-days: 90
